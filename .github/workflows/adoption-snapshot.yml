name: adoption-snapshot

# Collection lives here rather than in the Claude cloud routine because that
# sandbox blocks api.npmjs.org at the egress proxy, and its GitHub App token
# cannot carry the Administration:read that the traffic endpoints need.
# The routine still sends the Monday email; it reads what this job commits.

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC, an hour before the routine
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # Check out with the PAT when we have one, so the PR this job opens
      # triggers validate-skills. A PR pushed with GITHUB_TOKEN does not
      # start workflow runs, so its required check would never report and
      # the PR could never merge.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ADOPTION_PAT || secrets.GITHUB_TOKEN }}

      - name: Collect snapshot
        env:
          # ADOPTION_PAT is required for clones/views: the traffic endpoints
          # need Administration:read, and the Actions GITHUB_TOKEN is refused
          # with 403 (confirmed 2026-08-20). Without the secret the job still
          # succeeds and records those two cells as unavailable.
          ADOPTION_PAT: ${{ secrets.ADOPTION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 eval/scripts/adoption_snapshot.py

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.ADOPTION_PAT }}
          HAVE_PAT: ${{ secrets.ADOPTION_PAT != '' }}
        run: |
          if git diff --quiet -- eval/adoption-data.json eval/adoption-log.md; then
            echo "No change — snapshot for today already recorded."
            exit 0
          fi
          # Without the PAT there is no way to land this: Actions is barred
          # from opening PRs here, and a GITHUB_TOKEN PR never triggers the
          # validate-skills that main requires. Say so and stop — a missing
          # secret is a configuration state, not a build failure, and a red
          # X every Monday just teaches everyone to ignore the badge.
          if [ "$HAVE_PAT" != "true" ]; then
            {
              echo "### Adoption snapshot collected, not committed"
              echo
              echo "\`ADOPTION_PAT\` is not set, so this run could not open its PR."
              echo "The numbers below were gathered but discarded."
              echo
              echo "Set a fine-grained PAT with **Administration: read**,"
              echo "**Contents: write**, **Pull requests: write** on this repo,"
              echo "then re-run. See \`eval/adoption.md\`."
              echo
              echo '```'
              git --no-pager diff --stat -- eval/adoption-data.json eval/adoption-log.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=ADOPTION_PAT not set::Snapshot collected but not committed; no PR opened."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="adoption-snapshot-${DATE}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add eval/adoption-data.json eval/adoption-log.md
          git commit -m "docs(eval): adoption snapshot ${DATE}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "adoption snapshot ${DATE}" \
            --body "Automated weekly snapshot. Numbers in \`eval/adoption-data.json\`; rendered entry in \`eval/adoption-log.md\`. Cells reading \"unavailable\" mean the fetch failed — see this run's log."
          # main requires a PR plus a passing validate-skills, so queue the
          # merge rather than pushing straight at it.
          gh pr merge --squash --auto --delete-branch || \
            echo "Auto-merge unavailable — PR left open for manual merge."
